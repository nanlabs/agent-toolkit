# Target-specific agent frontmatter mappings (maintainer-owned).
# Canonical agents/<name>/AGENT.md stays neutral (name + description only).

version: 1

defaults:
  claude:
    tools: "Read, Grep, Glob, Bash"
  cursor:
    # Plugin agent .md files ship name + description; title is UI-only for Cursor rules.
    title_from: description

agents:
  nanlabs-assistant:
    cursor:
      title: NaNLABS repo discovery and orchestration

  nanlabs-architect:
    cursor:
      title: System design and architecture

  nanlabs-planner:
    cursor:
      title: Feature planning and task breakdown

  nanlabs-code-reviewer:
    cursor:
      title: Code quality review for NaNLABS repos

  nanlabs-security-reviewer:
    cursor:
      title: Security vulnerability review

  nanlabs-typescript-reviewer:
    cursor:
      title: TypeScript and JavaScript type safety review

  nanlabs-database-reviewer:
    cursor:
      title: PostgreSQL and database review

  nanlabs-tdd-guide:
    cursor:
      title: Test-driven development guide

  nanlabs-refactor-cleaner:
    cursor:
      title: Dead code cleanup and refactoring

  nanlabs-performance-optimizer:
    cursor:
      title: Performance analysis and optimization

  nanlabs-build-error-resolver:
    cursor:
      title: Build and TypeScript error resolution

  nanlabs-e2e-runner:
    cursor:
      title: Playwright end-to-end testing

  nanlabs-docs-lookup:
    cursor:
      title: Documentation and API reference lookup

  nanlabs-reference-lookup:
    cursor:
      title: NaNLABS reference examples lookup

  nanlabs-client-workflow-bootstrap:
    cursor:
      title: Client workspace bootstrap

  nanlabs-devcompanion-lead:
    cursor:
      title: Dev Companion team lead

  nanlabs-forge-pr:
    cursor:
      title: Forge PR/MR specialist

  nanlabs-data-validator:
    cursor:
      title: Data validation specialist
