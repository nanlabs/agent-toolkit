# Agent-toolkit skill catalog (public)
# Layout: plugins/nanlabs-<group>/skills/<skill>/SKILL.md (Agent Skills + Agent Plugins)
# Canonical skill metadata lives in SKILL.md frontmatter — not skill.json.
# This catalog is NaNLABS routing/index metadata for orchestrators and humans.
version: 2
layout: plugin-groups

groups:
  - id: core
    path: plugins/nanlabs-core/skills
    description: "Orchestration, setup, companion, and handshake skills"
  - id: data
    path: plugins/nanlabs-data/skills
    description: "dbt and Snowflake validation"
  - id: delivery
    path: plugins/nanlabs-delivery/skills
    description: "PRD/TRD/ADR, work items, assessments, and delivery process skills"
  - id: design
    path: plugins/nanlabs-design/skills
    description: "Figma and UI/UX skills"
  - id: forge
    path: plugins/nanlabs-forge/skills
    description: "GitHub/GitLab CLI automation"
  - id: integrations
    path: plugins/nanlabs-integrations/skills
    description: "ClickUp, Slack, Linear integrations"
  - id: ops
    path: plugins/nanlabs-ops/skills
    description: "Workstation triage, presentations ops, and skill contribution"
  - id: tooling
    path: plugins/nanlabs-tooling/skills
    description: "Playwright and Jupyter tooling"
  - id: workflow
    path: plugins/nanlabs-workflow/skills
    description: "Client delivery workflows and bootstrap"

skills:
  - name: nanlabs-assistant
    group: core
    path: plugins/nanlabs-core/skills/nanlabs-assistant
    public: true
    domain: orchestration
    responsibility: HOW
    role: orchestrator_and_fallback
