apiVersion: nanlabs.dev/v1
kind: RequirementContract
metadata:
  name: nanlabs-core
  description: >-
    Baseline tools required before nanlabs-core can guide marketplace and
    plugin installation, setup diagnostics, and Pyright reporting (Git, Python,
    OS package manager, AI client).
  appliesTo:
    - plugin:nanlabs-core
    - skill:nanlabs-setup
spec:
  requirements:
    binaries:
      - name: git
        required: true
        installed_by: workstation
        verify: git --version
      - name: python3
        required: true
        installed_by: workstation
        version: ">=3.12"
        verify: python3 --version
      - name: claude
        required: false
        installed_by: user
        verify: claude --version
        installers:
          macos: "Install Claude Code from https://claude.com/download"
          linux: "Install Claude Code from https://claude.com/download"
          windows: "Install Claude Code from https://claude.com/download"
      - name: cursor
        required: false
        installed_by: user
        verify: cursor --version
      - name: uvx
        required: false
        installed_by: user
        verify: uvx --version
        installers:
          macos: "Install uv from https://docs.astral.sh/uv/getting-started/installation/"
          linux: "Install uv from https://docs.astral.sh/uv/getting-started/installation/"
          windows: "Install uv from https://docs.astral.sh/uv/getting-started/installation/"
      - name: npx
        required: false
        installed_by: user
        verify: npx --version
        installers:
          macos: "Install Node.js from https://nodejs.org/ or your package manager"
          linux: "Install Node.js from https://nodejs.org/ or your package manager"
          windows: "Install Node.js from https://nodejs.org/ or winget/choco"
  capabilities:
    - filesystem.read
    - subprocess.execute
  setup:
    interactive: true
    never_auto_install: true
