name: PR review

concurrency:
  group: pr-review-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  pr-review:
    name: Danger JS
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: tools/danger/package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: tools/danger/.node-version
          cache: pnpm
          cache-dependency-path: tools/danger/pnpm-lock.yaml

      - name: Install Danger dependencies
        working-directory: tools/danger
        run: pnpm install --frozen-lockfile

      - name: Run Danger
        working-directory: tools/danger
        run: pnpm exec danger ci
        env:
          DANGER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
