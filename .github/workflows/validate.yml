name: Validate

concurrency:
  group: validate-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Manifests, skills, secrets, structure
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install pyyaml

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Validate repository structure
        run: bash scripts/validate-repo-structure.sh

      - name: Validate marketplace manifests
        run: python3 scripts/validate-manifests.py

      - name: Validate skills
        run: python3 scripts/validate-skills.py

      - name: Validate agents
        run: python3 scripts/validate-agents.py

      - name: Validate MCP templates
        run: python3 scripts/validate-mcp.py

      - name: Check agent surface drift
        run: python3 scripts/gen-surfaces.py --check

      - name: Validate requirement contracts
        run: python3 scripts/validate-contracts.py

      - name: Secret scan (tracked files)
        run: bash scripts/secret-scan.sh

  pre-commit:
    name: Pre-commit hooks
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit
        run: pre-commit run --all-files
