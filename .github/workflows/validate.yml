name: Validate

concurrency:
  group: validate-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Manifests, skills, secrets, structure
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install pyyaml jsonschema

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Validate repository structure
        run: bash scripts/validate-repo-structure.sh

      - name: Validate marketplace manifests
        run: python3 scripts/validate-manifests.py

      - name: Validate skills
        run: python3 scripts/validate-skills.py

      - name: Validate agents
        run: python3 scripts/validate-agents.py

      - name: Validate MCP templates
        run: python3 scripts/validate-mcp.py

      - name: Check agent surface drift
        run: python3 scripts/gen-surfaces.py --check

      - name: Validate requirement contracts
        run: python3 scripts/validate-contracts.py

      - name: Doctor baseline contract (read-only)
        run: python3 scripts/doctor-contracts.py --contract nanlabs-core

      - name: Doctor bundled in nanlabs-core plugin (read-only)
        run: python3 plugins/nanlabs-core/scripts/doctor-contracts.py --contract nanlabs-core

      - name: Secret scan (tracked files)
        run: bash scripts/secret-scan.sh

  pre-commit:
    name: Pre-commit hooks
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit
        run: pre-commit run --all-files

  skills-ref:
    name: Agent Skills upstream validator
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate all canonical skills
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r -d '' skill; do
            dir=$(dirname "$skill")
            echo "skills-ref: $dir"
            npx --yes skills-ref validate "$dir" || fail=1
          done < <(find skills -type f -name SKILL.md -print0 | sort -z)
          exit $fail

  claude-plugin-validate:
    name: Claude plugin validate
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Claude Code CLI
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Validate plugins (non-strict always; strict when supported)
        run: |
          set -euo pipefail
          claude --version || true
          for p in plugins/nanlabs-setup plugins/nanlabs-core plugins/nanlabs-agents; do
            if [[ -d "$p" ]]; then
              echo "validate $p"
              claude plugin validate "$p"
            fi
          done
          echo "Attempting --strict (may fail until #52 lands)"
          strict_fail=0
          for p in plugins/nanlabs-core plugins/nanlabs-agents; do
            if [[ -d "$p" ]]; then
              claude plugin validate --strict "$p" || strict_fail=1
            fi
          done
          # Soft gate until assembler lands: report but do not fail the job yet.
          # Flip to exit $strict_fail once #52 is on main.
          if [[ $strict_fail -ne 0 ]]; then
            echo "::warning::claude plugin validate --strict failed (tracked by #52/#57)"
          fi
