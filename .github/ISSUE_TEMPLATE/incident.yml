name: Incident
description: Unplanned production or user-impacting event needing immediate response
title: '[Incident]: '
type: Incident
body:
  - type: markdown
    attributes:
      value: |
        Aligns with NaNLABS `nanlabs-incident` skill. Prefer Bug for non-urgent defects in normal delivery.
  - type: textarea
    id: description
    attributes:
      label: Incident Summary
      description: What was observed and context.
    validations:
      required: true
  - type: textarea
    id: detection
    attributes:
      label: Detection Details
      value: |
        - Detected By:
        - Timestamp (UTC):
        - Environment:
        - Alert Source:
    validations:
      required: true
  - type: textarea
    id: timeline
    attributes:
      label: Timeline of Events
      value: |
        | Time (UTC) | Event |
        | --- | --- |
        | TBD | TBD |
      render: markdown
    validations:
      required: false
  - type: textarea
    id: impact
    attributes:
      label: Impact Summary
      value: |
        - Scope:
        - User Impact:
        - Duration:
    validations:
      required: true
  - type: textarea
    id: rca
    attributes:
      label: Root Cause Analysis
      value: |
        - Root Cause:
        - Contributing Factors:
        - Misaligned Expectations (if applicable):
    validations:
      required: false
  - type: textarea
    id: resolution
    attributes:
      label: Resolution
      value: |
        - Immediate Fix:
        - Validated In:
        - Status: Resolved / In Monitoring / Awaiting Confirmation
    validations:
      required: false
  - type: textarea
    id: action-items
    attributes:
      label: Action Items
      value: |
        - [ ] Action item 1
        - [ ] Action item 2
    validations:
      required: false
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical
        - High
        - Medium
        - Low
        - Unknown
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional Information
      value: |
        - Assigned To:
        - Reported On:
        - Due Date for Follow-Up:
    validations:
      required: false
