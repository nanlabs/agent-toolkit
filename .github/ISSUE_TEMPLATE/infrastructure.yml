---
name: "🛠️ Infrastructure, CI, or Tooling"
description: Suggest CI, marketplace manifests, release, validation, or repo config changes
title: "[INFRA]: short issue description"
labels: [infrastructure]
body:
  - type: markdown
    attributes:
      value: |
        Use this template for CI, marketplace manifests, release pipelines,
        contract validators, or repository configuration.

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why is this change needed?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Change
      description: What should be added, changed, or removed?
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: How does this affect contributors, install UX, or DX?
    validations:
      required: false

  - type: textarea
    id: validation
    attributes:
      label: Validation
      description: Which commands, checks, or workflows should be run?
      value: |
        - [ ] Run the affected workflow or local check
        - [ ] Verify marketplace / skills install still works when applicable
    validations:
      required: false

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I understand this may affect all consumers of agent-toolkit
          required: true
        - label: This request does not include secrets or private project links
          required: true
