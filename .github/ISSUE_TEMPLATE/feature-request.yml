name: Feature Request
description: Request, idea, or new functionality
title: "[Feature]: "
type: Feature
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Maps to org issue type **Feature**. For structured delivery work prefer Epic / User Story / Task templates.
  - type: textarea
    id: description
    attributes:
      label: Describe the feature
      description: A clear and concise description of the proposed feature.
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use Case
      description: Why do you need this feature?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Suggest how to implement the change. Include sketches or references.
    validations:
      required: false
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      value: |
        - [ ] Expected behavior implemented
        - [ ] Tests or validation updated
        - [ ] Docs updated if needed
    validations:
      required: false
  - type: textarea
    id: other
    attributes:
      label: Other Information
      description: Alternatives, related issues, links, etc.
    validations:
      required: false
  - type: checkboxes
    id: ack
    attributes:
      label: Acknowledgements
      options:
        - label: I may be able to implement this feature request
          required: false
        - label: This feature might incur a breaking change
          required: false
