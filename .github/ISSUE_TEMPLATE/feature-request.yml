---
name: 🚀 Feature Request
description: Propose a skill, agent, plugin, pack, contract, or distribution capability
title: "[FEATURE]: short issue description"
labels: [feature-request, enhancement]
body:
  - type: textarea
    id: description
    attributes:
      label: Describe the feature
      description: A clear and concise description of the proposed feature.
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use Case
      description: Why do you need this feature?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Suggest how to implement the change. Include sketches or references.
    validations:
      required: false

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: How will maintainers know this is complete?
      value: |
        - [ ] Expected behavior implemented
        - [ ] Tests or validation docs updated
        - [ ] No secrets in plugin content
    validations:
      required: false

  - type: textarea
    id: other
    attributes:
      label: Other Information
      description: Alternatives, related issues, migration-plan section links, etc.
    validations:
      required: false

  - type: checkboxes
    id: ack
    attributes:
      label: Acknowledgements
      options:
        - label: I may be able to implement this feature request
          required: false
        - label: This feature might incur a breaking change
          required: false

  - type: checkboxes
    id: public-safety
    attributes:
      label: Public issue checklist
      options:
        - label: This request does not include secrets or private project / client data
          required: true
