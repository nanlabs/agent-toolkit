---
name: "📕 Documentation Issue"
description: Report unclear, missing, or outdated docs in README, docs/, or authoring guides
title: "[DOCS]: short issue description"
labels: [documentation]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping us improve agent-toolkit documentation.

  - type: textarea
    id: description
    attributes:
      label: Describe the issue
      description: What is unclear, wrong, or missing?
    validations:
      required: true

  - type: textarea
    id: links
    attributes:
      label: Links / Affected files
      description: Paths or URLs to affected docs.
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested Content
      description: Draft, outline, or examples.
    validations:
      required: false

  - type: textarea
    id: validation
    attributes:
      label: Validation
      value: |
        - [ ] Verify all links resolve
        - [ ] Run markdown lint checks if available
    validations:
      required: false

  - type: checkboxes
    id: ack
    attributes:
      label: Acknowledgements
      options:
        - label: I may be able to submit a pull request for this documentation
          required: false
        - label: This issue does not include secrets or private project links
          required: true
