name: Propose skill
description: Propose a new public skill or agent for agent-toolkit
title: '[Skill]: '
type: Feature
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Share a skill via GitHub. Maintainers review for security, duplication, quality, and pack membership.
        After merge it is installable with `npx skills`. See `docs/CONTRIBUTION.md`.
  - type: input
    id: skill-name
    attributes:
      label: Proposed name
      description: Kebab-case directory name (must match SKILL.md `name`).
      placeholder: nanlabs-example-skill
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - Skill
        - Agent / subagent
        - Pack membership only
    validations:
      required: true
  - type: dropdown
    id: group
    attributes:
      label: Skill group (if a skill)
      options:
        - core
        - delivery
        - design
        - forge
        - integrations
        - data
        - workflow
        - ops
        - tooling
        - other / agent
    validations:
      required: true
  - type: textarea
    id: job
    attributes:
      label: Job to be done
      description: What it does and when to use it (trigger keywords).
    validations:
      required: true
  - type: textarea
    id: duplicates
    attributes:
      label: Duplicate check
      description: Skills or agents already in the catalogs that overlap, or "none found".
    validations:
      required: true
  - type: dropdown
    id: pack
    attributes:
      label: Target pack
      options:
        - core
        - delivery
        - design
        - forge
        - data
        - integrations
        - ops
        - tooling
        - workflow
        - code-review
        - qa
        - architect
        - staff
        - contribute
        - new pack (describe below)
        - N/A
    validations:
      required: true
  - type: textarea
    id: handoff
    attributes:
      label: Handoff / output
      description: Where the artifact lives (PR comment, HTML plan, ticket, paste-only). See docs/HANDOFFS.md.
    validations:
      required: false
  - type: checkboxes
    id: public-safe
    attributes:
      label: Public-safe
      options:
        - label: No secrets, private URLs, or client data (docs/PUBLIC_CONTENT_POLICY.md)
          required: true
        - label: Cloud users can follow this as a skill (or Code/Cursor-only steps are labeled)
          required: true
        - label: I can open a pull request with a real SKILL.md or AGENT.md (no placeholder directory)
          required: false
