# Single source of truth for plugin + marketplace versions (maintainer sync via gen-surfaces).
version: 1

marketplace:
  metadata:
    version: "0.4.0"
    description: "NaNLABS skills, agents, and plugins for Claude Code and Cursor IDE"

plugins:
  nanlabs-core:
    version: "0.2.0"
    description: "Recommended install: setup/onboarding, orchestrator, companion, handshake, Pyright report-only typing, PR fallback, knowledge sync, and code-reviewer agent"
    skills:
      - skills/core/nanlabs-setup
      - skills/core/nanlabs-assistant
      - skills/core/nanlabs-dev-companion
      - skills/core/nanlabs-output-handshake
      - skills/core/nanlabs-pyrightination
      - skills/core/nanlabs-pr-fallback
      - skills/core/nanlabs-workspace-knowledge-sync
    agents:
      - nanlabs-code-reviewer

  nanlabs-agents:
    version: "0.1.0"
    description: "Optional full set of NaNLABS agent / subagent personas (reviewers, architect, planner, e2e, …)"
    agents: all
