# Single source of truth for plugin + marketplace versions (maintainer sync via gen-surfaces).
version: 1

marketplace:
  metadata:
    version: "0.3.0"
    description: "NaNLABS skills, agents, plugins, and MCP stubs for Claude Code, Cursor, and compatible clients"

plugins:
  nanlabs-setup:
    version: "0.2.0"
    description: "Inspect the environment against dependency contracts and guide first-time NaN harness setup (approval before installs)"
    skills:
      - skills/core/nanlabs-setup

  nanlabs-core:
    version: "0.1.0"
    description: "Baseline orchestrator, companion, handshake, PR fallback, knowledge sync, and code-reviewer agent"
    skills:
      - skills/core/nanlabs-assistant
      - skills/core/nanlabs-dev-companion
      - skills/core/nanlabs-output-handshake
      - skills/core/nanlabs-pr-fallback
      - skills/core/nanlabs-workspace-knowledge-sync
    agents:
      - nanlabs-code-reviewer

  nanlabs-agents:
    version: "0.1.0"
    description: "Full set of NaNLABS agent / subagent personas (reviewers, architect, planner, e2e, …)"
    agents: all
