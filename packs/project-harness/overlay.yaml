apiVersion: nanlabs.dev/v1
kind: ProjectOverlay
metadata:
  name: project-harness-example
  owner: "technology@nanlabs.com"
  reviewBy: "2026-12-31"
  description: >-
    Public stub overlay showing required fields. Real project overlays live in
    private L3 repos — never commit client secrets here.
spec:
  requires:
    agentToolkit: ">=0.3.0"
    plugins:
      - nanlabs-core@0.1.0
      - nanlabs-agents@0.1.0
  composes:
    packs:
      - engineering-workflow
      - delivery-discipline
    capabilities:
      - mcp:github
  permissions:
    - filesystem.read
    - network.outbound
    - subprocess.execute
  dataClasses:
    - public-example
  envNames:
    - GITHUB_TOKEN
