<svg width="960" height="220" viewBox="0 0 960 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="NaNLABS agent-toolkit">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="50%" stop-color="#f7c948"/>
      <stop offset="100%" stop-color="#ff6b35"/>
    </linearGradient>
    <linearGradient id="wash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b35" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0.06"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#30363d" opacity="0.55"/>
    </pattern>
  </defs>

  <rect width="960" height="220" rx="14" fill="url(#bg)"/>
  <rect width="960" height="220" rx="14" fill="url(#dots)" opacity="0.45"/>
  <ellipse cx="480" cy="110" rx="420" ry="90" fill="url(#wash)"/>
  <rect x="180" y="0" width="600" height="3" rx="1.5" fill="url(#accent)"/>

  <text x="480" y="72" text-anchor="middle" fill="#f0f6fc" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="34" font-weight="700" letter-spacing="1.5">agent-toolkit</text>
  <text x="480" y="108" text-anchor="middle" fill="#8b949e" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="16">NaNLABS L1.5 · skills · agents · plugins</text>

  <!-- Surface pills -->
  <g font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="12" font-weight="600">
    <rect x="148" y="138" width="88" height="28" rx="14" fill="#21262d" stroke="#30363d"/>
    <text x="192" y="156" text-anchor="middle" fill="#ff6b35">Claude</text>

    <rect x="248" y="138" width="118" height="28" rx="14" fill="#21262d" stroke="#30363d"/>
    <text x="307" y="156" text-anchor="middle" fill="#f7c948">Claude Code</text>

    <rect x="378" y="138" width="100" height="28" rx="14" fill="#21262d" stroke="#30363d"/>
    <text x="428" y="156" text-anchor="middle" fill="#58a6ff">Cursor IDE</text>

    <rect x="490" y="138" width="140" height="28" rx="14" fill="#21262d" stroke="#30363d"/>
    <text x="560" y="156" text-anchor="middle" fill="#7ee787">Cursor Agent CLI</text>

    <rect x="642" y="138" width="100" height="28" rx="14" fill="#21262d" stroke="#30363d"/>
    <text x="692" y="156" text-anchor="middle" fill="#79c0ff">equal priority</text>

    <rect x="754" y="138" width="58" height="28" rx="14" fill="#21262d" stroke="#30363d"/>
    <text x="783" y="156" text-anchor="middle" fill="#8b949e">MIT</text>
  </g>

  <rect x="180" y="217" width="600" height="3" rx="1.5" fill="url(#accent)"/>
</svg>
