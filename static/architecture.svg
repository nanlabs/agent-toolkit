<svg width="1080" height="420" viewBox="0 0 1080 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="arch-title">
  <title id="arch-title">L1 workstation and L1.5 agent-toolkit layers</title>
  <defs>
    <linearGradient id="arch-panel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="arch-focus" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a2332"/>
      <stop offset="50%" stop-color="#21262d"/>
      <stop offset="100%" stop-color="#1a2332"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="420" rx="14" fill="#0d1117"/>
  <text x="540" y="36" text-anchor="middle" fill="#8b949e" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="13" letter-spacing="1.4">DISTRIBUTION LAYERS</text>

  <rect x="40" y="52" width="1000" height="70" rx="12" fill="url(#arch-panel)" stroke="#30363d"/>
  <text x="64" y="82" fill="#ff6b35" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="15" font-weight="700">L1 - internal-workstation (private)</text>
  <text x="64" y="104" fill="#8b949e" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="13">Machine provisioning, secrets, chezmoi. nan-ai-enable pins this repo.</text>

  <path d="M540 130 L540 150" stroke="#484f58" stroke-width="2"/>
  <path d="M532 142 L540 154 L548 142" fill="none" stroke="#484f58" stroke-width="2"/>

  <rect x="40" y="158" width="1000" height="148" rx="12" fill="url(#arch-focus)" stroke="#f7c948" stroke-width="1.6"/>
  <text x="64" y="190" fill="#f7c948" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="15" font-weight="700">L1.5 - nanlabs/agent-toolkit (this public repo)</text>
  <text x="64" y="214" fill="#c9d1d9" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="13">One plugin per skill group. Official hosted MCP. Catalogs are the source of truth.</text>
  <text x="64" y="236" fill="#8b949e" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="12">products/plugins.yaml · catalogs/mcp-catalog.yaml · catalogs/skills-layout.json</text>

